name: Daily Bet Scout

on:
  schedule:
    # Runs at 07:00 and 12:00 UTC every day — adjust times if you like.
    - cron: '0 7 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scan.py

      - name: Publish result
        run: |
          git config user.name "bet-scout-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Auto scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
